<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Nova guia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1e2e;
      color: #e4e4f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c5cff, #3ddc97);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .busca {
      width: 100%;
      max-width: 600px;
      height: 52px;
      background: #2a2a3c;
      border: 1px solid #3a3a50;
      border-radius: 26px;
      padding: 0 24px;
      color: #e4e4f0;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .busca:focus {
      border-color: #7c5cff;
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }
    .atalhos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }
    .atalho {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px;
      background: #2a2a3c;
      border: 1px solid #3a3a50;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: #e4e4f0;
    }
    .atalho:hover {
      background: #353548;
      border-color: #7c5cff;
      transform: translateY(-2px);
    }
    .atalho .icone {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: white;
    }
    .atalho .nome { font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="logo">Mini Browser</div>

  <input class="busca" id="busca" type="text"
         placeholder="Pesquise no Google ou digite uma URL" autofocus />

  <div class="atalhos" id="atalhos"></div>

  <script>
    const atalhos = [
      { nome: 'TomTicket', url: 'https://console.tomticket.com/', cor: '#f97316', letra: 'T' },
      { nome: 'GitHub',    url: 'https://github.com/',             cor: '#24292f', letra: 'G' },
      { nome: 'Gmail',     url: 'https://mail.google.com/',        cor: '#ea4335', letra: 'M' },
    ];

    const $atalhos = document.getElementById('atalhos');
    for (const a of atalhos) {
      const el = document.createElement('a');
      el.className = 'atalho';
      el.href = a.url;
      el.innerHTML = `
        <div class="icone" style="background:${a.cor}">${a.letra}</div>
        <div class="nome">${a.nome}</div>
      `;
      $atalhos.appendChild(el);
    }

    const $busca = document.getElementById('busca');
    $busca.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const t = $busca.value.trim();
      if (!t) return;

      let url;
      if (/^https?:\/\//i.test(t)) {
        url = t;
      } else if (!t.includes(' ') && /^[\w-]+(\.[\w-]+)+/.test(t)) {
        url = 'https://' + t;
      } else {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(t);
      }
      window.location.href = url;
    });
  </script>
</body>
</html>
