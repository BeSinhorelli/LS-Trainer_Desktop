<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carregando...</title>
  <style>
    body {
      margin: 0;
      background-color: #1e1e2e;
      color: #e4e4f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-splash {
      /* ⚠️ Tamanho Aumentado */
      width: 500px; 
      max-width: 90%; 
      height: auto;
      object-fit: contain;
      
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 1; 
        transform: scale(1); 
      }
      50% { 
        opacity: 0.7;
        transform: scale(0.95);
      }
    }
  </style>
</head>
<body>
  <img src="../images/icon.png" alt="LS Trainer" class="logo-splash" />
</body>
</html>
